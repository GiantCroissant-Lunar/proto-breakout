<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout 1976 - Side by Side</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: monospace;
            color: #ccc;
        }
        h1 { margin-bottom: 20px; font-size: 16px; color: #fff; }
        .comparison { display: flex; gap: 40px; align-items: flex-start; }
        .panel { display: flex; flex-direction: column; align-items: center; }
        .panel h2 { margin-bottom: 10px; font-size: 12px; color: #888; }
        canvas, img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Breakout (1976) - Reference vs Clone</h1>
    <div class="comparison">
        <div class="panel">
            <h2>Reference (250x360)</h2>
            <img src="reference.png" width="250" height="360" style="image-rendering: pixelated;">
        </div>
        <div class="panel">
            <h2>Clone (250x320? nah)</h2>
            <canvas id="game"></canvas>
        </div>
    </div>
    
    <script>
        const W = 250, H = 360, SCALE = 1;
        const canvas = document.getElementById('game');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        const C = {
            BLACK:  '#000000',
            WHITE:  '#CCCCCC',
            RED:    '#A31E0A',
            ORANGE: '#C6850A',
            GREEN:  '#0A8533',
            YELLOW: '#C2C229',
            BLUE:   '#0A85C2'
        };
        
        const BRICK_X = [0, 19, 37, 54, 72, 89, 107, 125, 142, 160, 177, 195, 212, 229];
        const BRICK_W = [17, 15, 15, 16, 15, 16, 15, 15, 16, 15, 15, 15, 15, 21];
        const BRICK_H = 4;
        
        const ROW_DEFS = [
            { y: 96,  color: C.RED },
            { y: 102, color: C.RED },
            { y: 108, color: C.ORANGE },
            { y: 114, color: C.ORANGE },
            { y: 120, color: C.GREEN },
            { y: 126, color: C.GREEN },
            { y: 132, color: C.YELLOW },
            { y: 138, color: C.YELLOW }
        ];
        
        function frame() {
            ctx.fillStyle = C.BLACK;
            ctx.fillRect(0, 0, W, H);
            
            // Top border
            ctx.fillStyle = '#A3A3A3';
            ctx.fillRect(0, 34, W, 1);
            ctx.fillStyle = C.WHITE;
            ctx.fillRect(0, 35, W, 11);
            ctx.fillStyle = '#6F6F6F';
            ctx.fillRect(0, 46, W, 1);
            
            // Side walls
            ctx.fillStyle = C.WHITE;
            ctx.fillRect(0, 0, 3, H);
            ctx.fillStyle = '#A3A3A3';
            ctx.fillRect(3, 0, 1, H);
            ctx.fillStyle = '#9A9A9A';
            ctx.fillRect(245, 0, 1, H);
            ctx.fillStyle = C.WHITE;
            ctx.fillRect(246, 0, 3, H);
            ctx.fillStyle = '#767676';
            ctx.fillRect(249, 0, 1, H);
            
            // Bricks
            for (const row of ROW_DEFS) {
                ctx.fillStyle = row.color;
                for (let i = 0; i < 14; i++) {
                    ctx.fillRect(BRICK_X[i], row.y, BRICK_W[i], BRICK_H);
                }
            }
            
            // Paddle
            ctx.fillStyle = C.BLUE;
            ctx.fillRect(117, 318, 16, 6);
            
            // Ball on paddle
            ctx.fillRect(123, 314, 4, 4);
            
            requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>
</html>
