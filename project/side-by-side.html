<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout 1976 - Side by Side</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: monospace;
            color: #ccc;
        }
        h1 { margin-bottom: 20px; font-size: 16px; color: #fff; }
        .comparison { display: flex; gap: 40px; align-items: flex-start; }
        .panel { display: flex; flex-direction: column; align-items: center; }
        .panel h2 { margin-bottom: 10px; font-size: 12px; color: #888; }
        canvas, img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Breakout (1976) - Reference vs Clone</h1>
    <div class="comparison">
        <div class="panel">
            <h2>Reference (263x379)</h2>
            <img src="reference-1976.png" width="263" height="379" style="image-rendering: pixelated;">
        </div>
        <div class="panel">
            <h2>Clone (263x379)</h2>
            <div id="game"></div>
        </div>
    </div>

    <script src="vendor/phaser-arcade-physics.min.js"></script>
    <script src="js/referenceLayout.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/GameOverScene.js"></script>
    <script>
        new Phaser.Game({
            type: Phaser.CANVAS,
            parent: 'game',
            width: BREAKOUT_1976.world.width,
            height: BREAKOUT_1976.world.height,
            backgroundColor: BREAKOUT_1976.colors.css.BLACK,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: [BootScene, GameScene, GameOverScene],
            scale: {
                mode: Phaser.Scale.NONE,
                autoCenter: Phaser.Scale.NO_CENTER
            },
            antialias: false,
            roundPixels: true,
            pixelArt: true
        });
    </script>
</body>
</html>
